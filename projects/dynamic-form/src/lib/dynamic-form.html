@if(this.dynamicFormDetails.formComponent){
  <form-type-index 
    [fields]="dynamicFormDetails.formComponent"
    (onSubmitForm)="submitForm($event)"
    (onCancelForm)="cancelForm()"
    (onFormValueChange)="valueChanges($event)"
    ></form-type-index>
} @else if(this.dynamicFormDetails.wizardComponent){
  <app-wizard 
    [wizardForm]="dynamicFormDetails.wizardComponent"
    (onSubmitWizardForm)="submitForm($event)"
    (onCancelWizardForm)="cancelForm()"
    (wizardFormValueChange)="valueChanges($event)"
  ></app-wizard>
}
