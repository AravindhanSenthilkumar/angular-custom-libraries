<section class="alert-modal-container">
    <div class="model-header">
      <div class="model-title text-{{ justification }}">{{ title }}</div>
      <button mat-button class="close-icon" [mat-dialog-close]="true">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="mat-dialog-content" mat-dialog-content>
      <lib-dynamic-loader
        [component]="inputData.component"
        [inputs]="inputs"
        [outputs]="outputs">
      </lib-dynamic-loader>
    </div>
  </section>
