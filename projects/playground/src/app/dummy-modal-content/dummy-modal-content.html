<div class="dummy-modal-body">
  <div class="banner-wrapper">
    <img src="modal_banner.png" alt="Modal Banner" class="banner-image" />
  </div>

  <div class="content-section">
    <h2 class="title">Analytics & Performance Insights</h2>
    <p class="description">
      Welcome to the updated dynamic modal system! This custom component is loaded dynamically with configurable size, position, and customizable border radius.
    </p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">28.5K</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">99.98%</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">1.2M</div>
        <div class="stat-label">Total Revenue</div>
      </div>
    </div>
  </div>

  <div class="actions-footer">
    <button mat-stroked-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save Changes</button>
  </div>
</div>
