<div class="playground-content" style="display: flex; flex-direction: column; gap: 20px; padding: 24px;">

  <!-- Primary trigger: reads ALL fields from the left JSON editor -->
  <div style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; box-shadow: 0 4px 15px rgba(102,126,234,0.35);">
    <div style="flex: 1;">
      <div style="color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 4px;">Open Modal from JSON</div>
      <div style="color: rgba(255,255,255,0.75); font-size: 13px;">Modify the JSON in the left panel, then click to trigger</div>
    </div>
    <button mat-raised-button (click)="openFromJson()" style="background:#fff; color:#764ba2; font-weight:700; border-radius:8px; min-width:140px;">
      ▶ Open Modal
    </button>
  </div>

  <!-- Position shortcut buttons -->
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
    <span style="font-size: 13px; color: #888; font-weight: 500; white-space: nowrap;">Position shortcuts:</span>
    <button mat-stroked-button color="primary" (click)="openCenterModal()">Center</button>
    <button mat-stroked-button color="accent" (click)="openRightDrawer()">Right Drawer</button>
    <button mat-stroked-button color="warn" (click)="openLeftDrawer()">Left Drawer</button>
    <button mat-stroked-button (click)="openBottomSheet()">Bottom Sheet</button>
  </div>

</div>
