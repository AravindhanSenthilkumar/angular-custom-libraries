<div class="playground-content" style="display: flex; flex-direction: column; gap: 24px; padding: 24px; width: 100%;">
  <div class="section">
    <h3 style="margin-bottom: 12px; font-weight: 600; color: #333;">Toast Types</h3>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button mat-raised-button color="primary" (click)="openSnackBar('success')">Success Toast</button>
      <button mat-raised-button color="warn" (click)="openSnackBar('error')">Error Toast</button>
      <button mat-raised-button color="accent" (click)="openSnackBar('warning')">Warning Toast</button>
      <button mat-raised-button (click)="openSnackBar('info')">Info Toast</button>
    </div>
  </div>

  <div class="section">
    <h3 style="margin-bottom: 12px; font-weight: 600; color: #333;">Test All 9 Positions</h3>
    <p style="margin-bottom: 12px; color: #666; font-size: 14px;">Click any position button below to trigger a toast at that location with a 16px frame margin:</p>
    <div class="position-grid">
      @for (pos of positions; track pos) {
        <button
          mat-stroked-button
          [class.active-pos]="toastData.position === pos"
          (click)="triggerToastAt(pos)"
        >
          {{ pos }}
        </button>
      }
    </div>
  </div>
</div>
